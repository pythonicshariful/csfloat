<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSFloat Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d0f14;--surface:#151820;--surface2:#1c2030;--border:#252b3b;--text-1:#e8ecf4;--text-2:#9aa3b8;--text-3:#5a6180;--green:#22c55e;--blue:#3b82f6;--orange:#f59e0b;--red:#ef4444;--purple:#a855f7;--gold:#fbbf24}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:100;background:rgba(13,15,20,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
    .logo{font-size:1.1rem;font-weight:700;color:var(--text-1);text-decoration:none}.logo span{color:var(--green)}
    .sep{flex:1}
    .back{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-2);font-size:.8rem;text-decoration:none;transition:all .2s}
    .back:hover{background:var(--border);color:var(--text-1)}
    .hero{padding:36px 24px 20px;max-width:1400px;margin:0 auto}
    .hero h1{font-size:1.75rem;font-weight:700;margin-bottom:6px}
    .hero p{color:var(--text-2);font-size:.88rem}
    .badge{display:inline-block;margin-left:10px;padding:2px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:.72rem;color:var(--text-3);vertical-align:middle}
    .stats{display:flex;gap:14px;flex-wrap:wrap;max-width:1400px;margin:0 auto 20px;padding:0 24px}
    .sc{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
    .sc .v{font-size:1.5rem;font-weight:700}.sc .l{font-size:.72rem;color:var(--text-3);margin-top:3px}
    .sc.gold .v{color:var(--gold)}.sc.green .v{color:var(--green)}.sc.blue .v{color:var(--blue)}
    .ctrl{max-width:1400px;margin:0 auto 14px;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .si{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text-1);font-size:.88rem;outline:none;transition:border-color .2s}
    .si:focus{border-color:var(--blue)}
    .fs{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text-2);font-size:.84rem;outline:none;cursor:pointer}
    .rb{padding:8px 18px;border-radius:8px;background:var(--green);border:none;color:#0a1a0f;font-size:.84rem;font-weight:600;cursor:pointer;transition:opacity .2s}
    .rb:hover{opacity:.85}
    .tw{max-width:1400px;margin:0 auto;padding:0 24px 48px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
    thead tr{background:var(--surface2)}
    th{padding:11px 14px;text-align:left;font-size:.7rem;font-weight:600;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
    th:hover{color:var(--text-1)}
    tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--surface2)}
    td{padding:10px 14px;font-size:.84rem;color:var(--text-2);white-space:nowrap}
    .nc{color:var(--text-1);font-weight:500;max-width:360px;white-space:normal}
    .fc{font-family:monospace;font-size:.79rem;color:var(--purple)}
    .rc{color:var(--text-3);font-size:.78rem}
    .pb{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:.88rem}
    .pb.ultra{background:rgba(251,191,36,.15);color:var(--gold);border:1px solid rgba(251,191,36,.3)}
    .pb.high{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25)}
    .pb.mid{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
    .pb.low{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.25)}
    .lb{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--blue);font-size:.76rem;text-decoration:none;transition:all .2s}
    .lb:hover{background:rgba(59,130,246,.15);border-color:var(--blue)}
    .st{color:var(--orange);font-weight:600}.sv{color:var(--gold);font-weight:600}
    .es{text-align:center;padding:80px 24px;color:var(--text-3)}
    .sp{display:flex;justify-content:center;align-items:center;padding:60px}
    .sp::after{content:'';width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="topbar">
  <a href="/" class="logo">CS<span>Float</span> Bot</a>
  <div class="sep"></div>
  <a href="/" class="back">&#8592; Back to Bot</a>
</div>
<div class="hero">
  <h1>&#x1F4B0; Expensive Items Found <span class="badge" id="heroCount">Loading...</span></h1>
  <p>All $300+ items scraped from CSFloat DB — sorted by price descending.</p>
</div>
<div class="stats">
  <div class="sc gold"><div class="v" id="sTotal">-</div><div class="l">Total Items</div></div>
  <div class="sc green"><div class="v" id="sHigh">-</div><div class="l">Highest Price</div></div>
  <div class="sc blue"><div class="v" id="sAvg">-</div><div class="l">Average Price</div></div>
  <div class="sc"><div class="v" id="sK">-</div><div class="l">Items $1,000+</div></div>
</div>
<div class="ctrl">
  <input class="si" type="text" id="q" placeholder="Search by name..." oninput="rt()" />
  <select class="fs" id="sf" onchange="rt()"><option value="">All Sources</option></select>
  <select class="fs" id="ss" onchange="rt()">
    <option value="pd">Price (Highest)</option>
    <option value="pa">Price (Lowest)</option>
    <option value="fa">Float (Lowest)</option>
    <option value="na">Name A-Z</option>
  </select>
  <button class="rb" onclick="loadData()">&#x21BA; Refresh</button>
</div>
<div class="tw">
  <div class="sp" id="sp"></div>
  <div id="es" class="es" style="display:none"><p style="font-size:3rem">&#x1F4C2;</p><br><p>No items yet. Run the scraper first!</p></div>
  <table id="tbl" style="display:none">
    <thead><tr><th>#</th><th>Item Name</th><th>Float</th><th>Price</th><th>Links</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>
<script>
var all=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function loadData(){
  document.getElementById('sp').style.display='flex';
  document.getElementById('tbl').style.display='none';
  document.getElementById('es').style.display='none';
  try{
    var d=await (await fetch('/api/results')).json();
    all=d.items||[];
    var srcs=[...new Set(all.map(i=>i.source_url))];
    document.getElementById('sf').innerHTML='<option value="">All Sources ('+all.length+')</option>'+srcs.map(s=>{var u=new URL(s),lbl=u.searchParams.get('defIndex')?'defIndex='+u.searchParams.get('defIndex'):s;return'<option value="'+esc(s)+'">'+esc(lbl)+'</option>';}).join('');
    if(all.length){
      var ps=all.map(i=>i.price),hi=Math.max(...ps),av=ps.reduce((a,b)=>a+b,0)/ps.length,kc=all.filter(i=>i.price>=1000).length;
      document.getElementById('sTotal').textContent=all.length;
      document.getElementById('sHigh').textContent='$'+hi.toLocaleString(undefined,{maximumFractionDigits:2});
      document.getElementById('sAvg').textContent='$'+Math.round(av).toLocaleString();
      document.getElementById('sK').textContent=kc;
      document.getElementById('heroCount').textContent=all.length+' items';
    }
    rt();
  }catch(e){document.getElementById('es').style.display='block';}
  finally{document.getElementById('sp').style.display='none';}
}
function rt(){
  var q=document.getElementById('q').value.toLowerCase(),src=document.getElementById('sf').value,srt=document.getElementById('ss').value;
  var items=all.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(!src||i.source_url===src));
  items.sort((a,b)=>srt==='pa'?a.price-b.price:srt==='fa'?parseFloat(a.float||'1')-parseFloat(b.float||'1'):srt==='na'?a.name.localeCompare(b.name):b.price-a.price);
  if(!items.length){document.getElementById('tbl').style.display='none';document.getElementById('es').style.display='block';return;}
  document.getElementById('tbl').style.display='table';document.getElementById('es').style.display='none';
  var rows='';
  items.forEach(function(it,idx){
    var bd=it.price>=10000?'ultra':it.price>=3000?'high':it.price>=1000?'mid':'low';
    var cls=it.name.includes('StatTrak')?'st':it.name.includes('Souvenir')?'sv':'';
    var di='';try{di=new URL(it.source_url).searchParams.get('defIndex')||'';}catch(e){}
    var su=di?'https://csfloat.com/search?def_index='+di+'&sort_by=lowest_price':it.source_url;
    rows+='<tr><td class="rc">'+(idx+1)+'</td><td class="nc"><span class="'+cls+'">'+esc(it.name)+'</span></td><td class="fc">'+esc(it.float?it.float.substring(0,14):'-')+'</td><td><span class="pb '+bd+'">$'+it.price.toLocaleString(undefined,{maximumFractionDigits:2})+'</span></td><td><a class="lb" href="'+esc(su)+'" target="_blank">Search</a> <a class="lb" href="'+esc(it.source_url)+'" target="_blank">DB</a></td></tr>';
  });
  document.getElementById('tb').innerHTML=rows;
}
loadData();
</script>
</body>
</html>
